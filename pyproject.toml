[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "signed-archive"
version = "0.1.0"
description = "CLI tool for TSA timestamping, archiving, and eIDAS-compliant reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "httpx",
    "cryptography",
    "asn1crypto",
    "fpdf2",
    "endesive",
    "PyYAML",
    "portalocker",
]

[project.scripts]
signed-archive = "signed_archive.cli.main:app"

[dependency-groups]
dev = [
    "specify-cli>=0.14.4",
]
